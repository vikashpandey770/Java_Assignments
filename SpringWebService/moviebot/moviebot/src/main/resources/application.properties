# =========================================================
# Task 1: OpenAI API key storage
# =========================================================
# 1. Sign up at https://platform.openai.com
# 2. Go to https://platform.openai.com/api-keys and generate a new secret key
# 3. NEVER commit your real key to source control / GitHub.
#    Instead, set it as an environment variable named OPENAI_API_KEY and
#    this file will pick it up automatically via ${OPENAI_API_KEY}.
#
#    Mac/Linux : export OPENAI_API_KEY=sk-xxxxxxxxxxxxxxxx
#    Windows   : setx OPENAI_API_KEY "sk-xxxxxxxxxxxxxxxx"
#
# The ":}" after the variable name means "default to empty string if the
# env var isn't set" so the app still boots (and our error handling in
# Task 3 will kick in and report the missing key cleanly).
openai.api.key=${OPENAI_API_KEY:}
openai.api.url=https://api.openai.com/v1/chat/completions
openai.api.model=gpt-4o-mini

# =========================================================
# Server config
# =========================================================
server.port=8080
spring.application.name=moviebot

# =========================================================
# Logging
# =========================================================
logging.level.com.moviebot=INFO
